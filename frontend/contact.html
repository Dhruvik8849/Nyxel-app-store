<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nyxel App Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="brand"><a href="/">
          <img src="/media/ic_launcher_foreground.webp" alt="Nyxel App Store" class="brand-logo">
          <span class="brand-text">Nyxel App Store</span>
        </a></div>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="rating.html">Ratings</a>
        <a href="about.html">About</a>
        <a href="security.html">Security</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2 style="margin-top:18px">Contact Us</h2>
    <p class="muted">Have a question, partnership inquiry, or need help publishing? Contact our team.</p>

    <div style="display:grid;grid-template-columns:1fr 320px;gap:20px;margin-top:18px">
      <div>
        <form class="app-card" onsubmit="event.preventDefault();alert('Message sent (demo)')">
          <label>Your name</label>
          <input placeholder="Dhruvik" style="width:100%;padding:10px;border-radius:8px;margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,0.04)">
          <label style="margin-top:12px">Email</label>
          <input placeholder="you@example.com" style="width:100%;padding:10px;border-radius:8px;margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,0.04)">
          <label style="margin-top:12px">Message</label>
          <textarea placeholder="How can we help?" style="width:100%;padding:10px;border-radius:8px;margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,0.04);min-height:120px"></textarea>
          <div style="margin-top:12px"><button class="glow-btn">Send Message</button></div>
        </form>
      </div>
      <aside>
        <div class="widget">
          <strong>Email</strong>
          <div class="muted">hello@nyxel.example</div>
        </div>
        <div class="widget">
          <strong>Phone</strong>
          <div class="muted">+1 (555) 123-4567</div>
        </div>
        <div class="widget">
          <strong>Address</strong>
          <div class="muted">88 Innovation Way, Suite 200, Austin, TX</div>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
